<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Angel Developer</title>
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo-icon"><i class="fas fa-code"></i></span>
      <span class="sidebar-logo-text">Angel<span class="highlight">Dev</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="sidebar-link active" data-tab="portfolio">
        <i class="fas fa-briefcase"></i> Portfolio
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="index.html" class="sidebar-link">
        <i class="fas fa-arrow-left"></i> Back to Site
      </a>
    </div>
  </aside>

  <!-- Mobile Header -->
  <header class="mobile-header">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      <i class="fas fa-bars"></i>
    </button>
    <span class="mobile-title">Admin Dashboard</span>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="content-header">
      <div>
        <h1>Portfolio Manager</h1>
        <p>Add, edit, and remove portfolio items. Changes appear on the live site instantly.</p>
      </div>
    </div>

    <!-- Add Project Form -->
    <div class="card add-project-card">
      <h2><i class="fas fa-plus-circle"></i> Add New Project</h2>
      <form id="addProjectForm" class="project-form">
        <div class="form-row">
          <div class="form-group">
            <label for="projectUrl">Website URL <span class="required">*</span></label>
            <input type="url" id="projectUrl" placeholder="https://example.com" required />
          </div>
          <div class="form-group">
            <label for="projectName">Project Name</label>
            <input type="text" id="projectName" placeholder="Auto-detected from URL" />
          </div>
        </div>
        <div class="form-group">
          <label for="projectDesc">Description</label>
          <input type="text" id="projectDesc" placeholder="Brief description of the project" />
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-plus"></i> Add to Portfolio
        </button>
      </form>
    </div>

    <!-- Portfolio Items List -->
    <div class="card">
      <div class="card-header">
        <h2><i class="fas fa-th-large"></i> Portfolio Items</h2>
        <span class="item-count" id="itemCount">0 items</span>
      </div>
      <div class="portfolio-list" id="portfolioList">
        <div class="empty-state" id="emptyState">
          <i class="fas fa-folder-open"></i>
          <p>No portfolio items yet. Add your first project above.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
